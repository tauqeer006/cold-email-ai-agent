services:
  api:
    build: .
    container_name: cold-email-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - exports_data:/app/exports
      - ./instructions:/app/instructions:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  exports_data:
